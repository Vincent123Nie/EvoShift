base_config: configs/experiments/policy_shift_causal_memory_demo.yaml
seeds: [133, 155, 233, 277, 333]
algorithms:
  - evoshift
grid:
  benchmark.feedback_noise_rate: [0.10]
  benchmark.feedback_attack_burst_length: [0, 2, 4]
variants:
  current_fast_confirmation:
    evolution.candidate_min_mature_feedback_observations: 0
    evolution.active_audit_circuit_breaker_enabled: true
    evolution.active_audit_lineage_control_enabled: true
    evolution.dormant_revival_enabled: true
    evolution.dormant_revival_min_trust: 0.10
    evolution.dormant_revival_delta: 0.75
    evolution.dormant_revival_max_age: 8
    evolution.dormant_revival_min_retired_age: 15
    evolution.dormant_revival_status_index_enabled: true
    evolution.dormant_revival_semantic_index_enabled: true
    evolution.dormant_revival_retirement_context_enabled: true
    evolution.active_audit_reactivation_grace_episodes: 8
    evolution.active_audit_retirement_probation_enabled: true
    evolution.active_audit_retirement_probation_context_scoped: false
    evolution.active_audit_retirement_probation_fast_confirm_enabled: true
    evolution.active_audit_retirement_probation_fast_confirm_min_trust: 0.92
    evolution.active_audit_retirement_probation_fast_revival_cooldown_episodes: 13
    evolution.active_audit_retirement_probation_max_age: 24
    evolution.active_audit_retirement_probation_min_confirmations: 2
    evolution.active_audit_retirement_probation_min_evidence_span: 2
    evolution.dynamic_feedback_change_min_span: 0
  two_mature_feedback_admission:
    evolution.candidate_min_mature_feedback_observations: 2
    evolution.active_audit_circuit_breaker_enabled: true
    evolution.active_audit_lineage_control_enabled: true
    evolution.dormant_revival_enabled: true
    evolution.dormant_revival_min_trust: 0.10
    evolution.dormant_revival_delta: 0.75
    evolution.dormant_revival_max_age: 8
    evolution.dormant_revival_min_retired_age: 15
    evolution.dormant_revival_status_index_enabled: true
    evolution.dormant_revival_semantic_index_enabled: true
    evolution.dormant_revival_retirement_context_enabled: true
    evolution.active_audit_reactivation_grace_episodes: 8
    evolution.active_audit_retirement_probation_enabled: true
    evolution.active_audit_retirement_probation_context_scoped: false
    evolution.active_audit_retirement_probation_fast_confirm_enabled: true
    evolution.active_audit_retirement_probation_fast_confirm_min_trust: 0.92
    evolution.active_audit_retirement_probation_fast_revival_cooldown_episodes: 13
    evolution.active_audit_retirement_probation_max_age: 24
    evolution.active_audit_retirement_probation_min_confirmations: 2
    evolution.active_audit_retirement_probation_min_evidence_span: 2
    evolution.dynamic_feedback_change_min_span: 0
# Targeted failure-seed diagnostic: 2 variants * 5 seeds * 3 burst lengths.
max_runs: 30
