base_config: configs/experiments/policy_shift_causal_memory_demo.yaml
seeds: [122, 133, 144, 155, 166]
algorithms:
  - evoshift
grid:
  benchmark.feedback_attack_rate: [0.0]
  benchmark.feedback_noise_rate: [0.0, 0.10]
  benchmark.feedback_attack_burst_length: [0, 2, 4]
variants:
  current_fixed_consensus:
    evolution.dynamic_feedback_change_point_enabled: false
  bayes_change_point:
    evolution.dynamic_feedback_change_point_enabled: true
    evolution.dynamic_feedback_change_hazard: 0.15
    evolution.dynamic_feedback_change_epsilon_0: 0.10
    evolution.dynamic_feedback_change_epsilon_1: 0.10
    evolution.dynamic_feedback_change_threshold: 0.60
    evolution.dynamic_feedback_change_soft_trust: 0.65
    evolution.dynamic_feedback_change_max_run_length: 10000
# 2 variants * 5 seeds * 2 noise levels * 3 burst lengths = 60 runs
# (30 paired variant contrasts).
max_runs: 60
