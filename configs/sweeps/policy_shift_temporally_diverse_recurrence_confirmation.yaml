base_config: configs/experiments/policy_shift_causal_memory_demo.yaml
seeds: [177, 188, 199, 211, 222]
algorithms:
  - evoshift
grid:
  benchmark.feedback_noise_rate: [0.0, 0.10]
  benchmark.feedback_attack_burst_length: [0, 2]
variants:
  current_full:
    evolution.active_audit_circuit_breaker_enabled: false
    evolution.active_audit_lineage_control_enabled: false
    evolution.dormant_revival_enabled: false
    evolution.dynamic_feedback_change_min_span: 0
    evolution.dormant_revival_status_index_enabled: false
  lineage_revival_15:
    evolution.active_audit_circuit_breaker_enabled: true
    evolution.active_audit_lineage_control_enabled: true
    evolution.dormant_revival_enabled: true
    evolution.dormant_revival_min_trust: 0.10
    evolution.dormant_revival_delta: 0.75
    evolution.dormant_revival_max_age: 8
    evolution.dormant_revival_min_retired_age: 15
    evolution.dynamic_feedback_change_min_span: 0
    evolution.dormant_revival_status_index_enabled: false
  chain_safe_recurrence:
    evolution.active_audit_circuit_breaker_enabled: true
    evolution.active_audit_lineage_control_enabled: true
    evolution.dormant_revival_enabled: true
    evolution.dormant_revival_min_trust: 0.10
    evolution.dormant_revival_delta: 0.75
    evolution.dormant_revival_max_age: 8
    evolution.dormant_revival_min_retired_age: 15
    evolution.dynamic_feedback_change_min_span: 2
    evolution.dormant_revival_status_index_enabled: true
# Frozen confirmation: 3 variants * 5 new seeds * 2 noise levels * 2 bursts.
max_runs: 60
