base_config: configs/experiments/policy_shift_causal_memory_demo.yaml
seeds: [233, 255]
algorithms:
  - evoshift
grid:
  benchmark.feedback_attack_rate: [0.0]
  benchmark.feedback_attack_burst_length: [0]
  benchmark.feedback_noise_rate: [0.0, 0.10]
  benchmark.feedback_warmup_attack_burst_length: [0, 1, 2]
variants:
  current_fixed_consensus:
    evolution.dynamic_feedback_change_point_enabled: false
    evolution.shadow_candidate_enabled: false
    evolution.change_point_shadow_candidate_enabled: false
    evolution.candidate_min_trusted_observations: 1
  posterior_gated_shadow:
    evolution.dynamic_feedback_change_point_enabled: true
    evolution.dynamic_feedback_change_hazard: 0.15
    evolution.dynamic_feedback_change_epsilon_0: 0.10
    evolution.dynamic_feedback_change_epsilon_1: 0.10
    evolution.dynamic_feedback_change_threshold: 0.60
    evolution.dynamic_feedback_change_soft_trust: 0.65
    evolution.shadow_candidate_enabled: true
    evolution.change_point_shadow_candidate_enabled: true
    evolution.min_feedback_trust_for_shadow_candidate: 0.10
    evolution.candidate_min_trusted_observations: 0
    evolution.shadow_eprocess_enabled: false
# 2 variants * 2 seeds * 2 noise levels * 3 warm-start bursts = 24 runs.
max_runs: 24
