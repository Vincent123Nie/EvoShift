base_config: configs/experiments/policy_shift_causal_memory_demo.yaml
seeds: [11, 22, 33, 44, 55]
algorithms:
  - evoshift
grid:
  benchmark.feedback_noise_rate: [0.0, 0.10]
  benchmark.feedback_attack_burst_length: [0, 2]
variants:
  current_full:
    evolution.active_audit_early_retire_enabled: false
    evolution.active_audit_restore_predecessors: false
  sequential_causal_retirement:
    evolution.active_audit_early_retire_enabled: true
    evolution.active_audit_early_retire_delta: -0.75
    evolution.active_audit_restore_predecessors: false
# 2 variants * 5 seeds * 2 noise levels * 2 burst lengths = 40 demo runs.
max_runs: 40
