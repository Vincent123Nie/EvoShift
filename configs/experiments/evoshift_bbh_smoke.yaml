project: evoshift-bbh-smoke
algorithm: evoshift
provider:
  kind: responses
  base_url: https://api.openai.com/v1
  api_key_env: EVOSHIFT_OPENAI_API_KEY
  model: gpt-5.6
  max_output_tokens: 384
  reasoning_effort: low
budget:
  max_requests: 300
  max_total_tokens: 500000
  max_cost_usd: 20.0
storage:
  cache_enabled: true
  isolate_runs: true
benchmark:
  kind: bbh
  name: bbh_shift_smoke
  path: data/benchmarks/bbh
  revision: 9ee07bd481feebf959a6b59d61ea57bdcf30964d
  subsets:
    - boolean_expressions
    - date_understanding
    - multistep_arithmetic_two
    - tracking_shuffled_objects_three_objects
  phase_size: 4
  shuffle: true
  protected_phases:
    - phase_00_boolean_expressions
evolution:
  validation_window: 6
  min_validation_examples: 4
  bootstrap_samples: 500
  min_mean_gain: 0.05
  min_ci_lower_bound: -0.05
  max_regression_rate: 0.20
  max_protected_slice_regression: 0.0
  max_cost_increase_ratio: 0.40
  paired_replay: true
  feedback_mode: reward_only
