project: evoshift-bbh-heldout-audit
algorithm: evoshift

provider:
  kind: responses
  base_url: https://api.openai.com/v1
  api_key_env: EVOSHIFT_OPENAI_API_KEY
  model: gpt-5.6
  max_output_tokens: 384
  reasoning_effort: low

budget:
  max_requests: 100
  max_total_tokens: 500000
  max_cost_usd: 20.0

storage:
  cache_enabled: true
  isolate_runs: true

benchmark:
  kind: bbh
  name: bbh_unseen_domain_audit
  path: data/benchmarks/bbh
  revision: 9ee07bd481feebf959a6b59d61ea57bdcf30964d
  subsets:
    - formal_fallacies
    - geometric_shapes
    - hyperbaton
    - web_of_lies
  phase_size: 16
  shuffle: true

# These switches remain explicit for provenance. `evoshift audit` additionally
# enforces mutation-free execution in code, even if this block is overridden.
evolution:
  enabled: false
  policy_evolution_enabled: false
  policy_evolve_on_shift: false

evaluation:
  seed: 2026
  bootstrap_samples: 2000
  confidence_level: 0.95
