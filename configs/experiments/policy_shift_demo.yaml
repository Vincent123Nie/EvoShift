project: evoshift-policy-shift-demo
algorithm: evoshift

provider:
  kind: demo
  model: evoshift-demo
  max_output_tokens: 512
  reasoning_effort: null

budget:
  max_requests: 2000
  max_total_tokens: 3000000
  max_cost_usd: 0.0

storage:
  cache_enabled: false
  isolate_runs: true
  runs_dir: runs

benchmark:
  kind: policy_shift
  name: enterprise_refund_policy_shift
  path: null
  phase_size: 24
  shuffle: false
  feedback_noise_rate: 0.10
  feedback_attack_rate: 0.10

shift:
  enabled: true
  min_instances: 6
  threshold: 0.80
  delta: 0.0
  novelty_threshold: 0.80
  cooldown_episodes: 4

evolution:
  enabled: true
  validation_window: 16
  min_validation_examples: 8
  bootstrap_samples: 1000
  confidence_level: 0.90
  min_mean_gain: 0.05
  min_ci_lower_bound: -0.01
  max_regression_rate: 0.10
  max_protected_slice_regression: 0.0
  max_cost_increase_ratio: 1.0
  paired_replay: true
  feedback_mode: reward_only
  policy_evolution_enabled: true
  policy_evolve_on_shift: true

evaluation:
  seed: 42
  bootstrap_samples: 2000
  confidence_level: 0.95
  recovery_fraction: 0.90

policy:
  top_k: 3
  memory_token_budget: 700
  write_confidence_threshold: 0.50
  dedup_similarity_threshold: 0.82
  rollback_min_uses: 6
  rollback_utility_threshold: 0.30
  allow_cross_domain_transfer: false
