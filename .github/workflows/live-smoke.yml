name: Live provider smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: OpenAI-compatible API root ending in /v1
        required: true
        default: https://api.openai.com/v1
      model:
        description: Model exposed by the selected endpoint
        required: true
        default: gpt-5.6

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: live-api
    env:
      EVOSHIFT_OPENAI_API_KEY: ${{ secrets.EVOSHIFT_OPENAI_API_KEY }}
      TARGET_BASE_URL: ${{ inputs.base_url }}
      TARGET_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: One explicitly paid request
        run: >-
          evoshift provider smoke
          --config configs/models/gateway_gpt56.yaml
          --set "provider.base_url=${TARGET_BASE_URL}"
          --set "provider.model=${TARGET_MODEL}"
