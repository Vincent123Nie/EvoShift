[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evoshift"
version = "0.1.0"
description = "Verified test-time self-evolution for API-only LLM agents under distribution shift"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vincent Nie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
hf = ["datasets>=2.20,<5"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
evoshift = "evoshift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evoshift"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that call a paid external API",
  "integration: multi-component tests",
]

[tool.coverage.run]
branch = true
source = ["evoshift"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/evoshift/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["evoshift"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
